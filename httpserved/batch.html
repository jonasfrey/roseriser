<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roseriser - Batch DXF to STL Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4cc9f0;
        }
        .section {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #4cc9f0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .file-select {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .file-select label {
            min-width: 150px;
        }
        .file-select select, .file-select input[type="file"] {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #4cc9f0;
            background: #0f3460;
            color: #eee;
        }
        .file-list {
            background: #0f3460;
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .file-item {
            padding: 5px 10px;
            border-bottom: 1px solid #16213e;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item.processed {
            color: #4ade80;
        }
        .file-item.error {
            color: #f87171;
        }
        .file-item.processing {
            color: #fbbf24;
        }
        button {
            background: #4cc9f0;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .btn-container {
            text-align: center;
            margin: 20px 0;
        }
        .progress {
            background: #0f3460;
            border-radius: 4px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            background: #4cc9f0;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .status {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
        .log {
            background: #0a0a15;
            border-radius: 4px;
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-entry {
            padding: 2px 0;
        }
        .log-entry.error {
            color: #f87171;
        }
        .log-entry.success {
            color: #4ade80;
        }
        .log-entry.info {
            color: #60a5fa;
        }
        a {
            color: #4cc9f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Batch DXF to STL Converter</h1>
        <p style="text-align: center; margin-bottom: 20px;">
            <a href="index.html">Back to Home</a>
        </p>

        <div class="section">
            <h2>1. Select Profile Files</h2>
            <div class="file-select">
                <label>Profile DXF:</label>
                <select id="profile-select">
                    <option value="">-- Select Profile --</option>
                </select>
            </div>
            <div class="file-select">
                <label>Profile Remover DXF:</label>
                <select id="remover-select">
                    <option value="">-- Select Profile Remover --</option>
                </select>
            </div>
        </div>

        <div class="section">
            <h2>2. Input DXF Files (from input_dxf_files/)</h2>
            <div class="file-list" id="input-files">
                <div class="file-item">Loading...</div>
            </div>
            <button id="refresh-btn" style="margin-top: 10px; padding: 8px 16px; font-size: 0.9em;">
                Refresh File List
            </button>
        </div>

        <div class="btn-container">
            <button id="convert-btn" disabled>Convert DXF to STL</button>
        </div>

        <div class="section">
            <h2>Progress</h2>
            <div class="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="status" id="status">Ready</div>
        </div>

        <div class="section">
            <h2>Log</h2>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script type="module">
        const profileSelect = document.getElementById('profile-select');
        const removerSelect = document.getElementById('remover-select');
        const inputFilesDiv = document.getElementById('input-files');
        const convertBtn = document.getElementById('convert-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        const progressBar = document.getElementById('progress-bar');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        let inputFiles = [];

        function log(message, type = '') {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function loadProfileOptions() {
            try {
                const response = await fetch('/api/list-profiles');
                const profiles = await response.json();

                profileSelect.innerHTML = '<option value="">-- Select Profile --</option>';
                removerSelect.innerHTML = '<option value="">-- Select Profile Remover --</option>';

                profiles.forEach(file => {
                    const opt1 = document.createElement('option');
                    opt1.value = file;
                    opt1.textContent = file;
                    profileSelect.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = file;
                    opt2.textContent = file;
                    removerSelect.appendChild(opt2);
                });

                log('Loaded profile options', 'info');
            } catch (err) {
                log('Error loading profiles: ' + err.message, 'error');
            }
        }

        async function loadInputFiles() {
            try {
                const response = await fetch('/api/list-input-files');
                inputFiles = await response.json();

                if (inputFiles.length === 0) {
                    inputFilesDiv.innerHTML = '<div class="file-item">No DXF files found in input_dxf_files/</div>';
                } else {
                    inputFilesDiv.innerHTML = inputFiles.map(f =>
                        `<div class="file-item" data-file="${f}">${f}</div>`
                    ).join('');
                }

                updateConvertButton();
                log(`Found ${inputFiles.length} input files`, 'info');
            } catch (err) {
                log('Error loading input files: ' + err.message, 'error');
                inputFilesDiv.innerHTML = '<div class="file-item error">Error loading files</div>';
            }
        }

        function updateConvertButton() {
            const hasProfile = profileSelect.value !== '';
            const hasRemover = removerSelect.value !== '';
            const hasFiles = inputFiles.length > 0;
            convertBtn.disabled = !(hasProfile && hasRemover && hasFiles);
        }

        async function startConversion() {
            const profile = profileSelect.value;
            const remover = removerSelect.value;

            if (!profile || !remover || inputFiles.length === 0) {
                log('Please select profile, remover, and ensure input files exist', 'error');
                return;
            }

            convertBtn.disabled = true;
            progressBar.style.width = '0%';
            statusDiv.textContent = 'Starting conversion...';
            log('Starting batch conversion...', 'info');

            try {
                const response = await fetch('/api/batch-convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        profile: profile,
                        remover: remover
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line in buffer

                    for (const line of lines) {
                        if (line.trim()) {
                            try {
                                const event = JSON.parse(line);
                                handleEvent(event);
                            } catch (e) {
                                console.log('Parse error:', line);
                            }
                        }
                    }
                }

                statusDiv.textContent = 'Conversion complete!';
                log('Batch conversion complete!', 'success');
            } catch (err) {
                log('Conversion error: ' + err.message, 'error');
                statusDiv.textContent = 'Error: ' + err.message;
            } finally {
                convertBtn.disabled = false;
                updateConvertButton();
            }
        }

        function handleEvent(event) {
            switch (event.type) {
                case 'progress':
                    const pct = (event.current / event.total * 100).toFixed(0);
                    progressBar.style.width = pct + '%';
                    statusDiv.textContent = `Processing ${event.current}/${event.total}: ${event.file}`;
                    break;
                case 'scad_generated':
                    log(`SCAD generated: ${event.file}`, 'success');
                    updateFileStatus(event.file, 'processing');
                    break;
                case 'stl_generated':
                    log(`STL generated: ${event.file}`, 'success');
                    if (event.log && event.log.trim()) {
                        log(`OpenSCAD output:\n${event.log}`, 'info');
                    }
                    updateFileStatus(event.file.replace('.stl', '.dxf'), 'processed');
                    break;
                case 'error':
                    log(`Error: ${event.file}`, 'error');
                    log(`${event.message}`, 'error');
                    updateFileStatus(event.file, 'error');
                    break;
                case 'complete':
                    progressBar.style.width = '100%';
                    log(`Completed: ${event.success} successful, ${event.failed} failed`, 'info');
                    break;
            }
        }

        function updateFileStatus(filename, status) {
            const item = inputFilesDiv.querySelector(`[data-file="${filename}"]`);
            if (item) {
                item.className = 'file-item ' + status;
            }
        }

        // Event listeners
        profileSelect.addEventListener('change', updateConvertButton);
        removerSelect.addEventListener('change', updateConvertButton);
        convertBtn.addEventListener('click', startConversion);
        refreshBtn.addEventListener('click', loadInputFiles);

        // Initial load
        loadProfileOptions();
        loadInputFiles();
    </script>
</body>
</html>
