<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roseriser - Batch DXF to STL Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4cc9f0;
        }
        .section {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #4cc9f0;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .file-select {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .file-select label {
            min-width: 150px;
        }
        .file-select select, .file-select input[type="file"] {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #4cc9f0;
            background: #0f3460;
            color: #eee;
        }
        .file-list {
            background: #0f3460;
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .file-item {
            padding: 5px 10px;
            border-bottom: 1px solid #16213e;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-item.processed {
            color: #4ade80;
        }
        .file-item.error {
            color: #f87171;
        }
        .file-item.processing {
            color: #fbbf24;
        }
        button {
            background: #4cc9f0;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .btn-container {
            text-align: center;
            margin: 20px 0;
        }
        .progress {
            background: #0f3460;
            border-radius: 4px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            background: #4cc9f0;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .status {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
        .log {
            background: #0a0a15;
            border-radius: 4px;
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-entry {
            padding: 2px 0;
        }
        .log-entry.error {
            color: #f87171;
        }
        .log-entry.success {
            color: #4ade80;
        }
        .log-entry.info {
            color: #60a5fa;
        }
        a {
            color: #4cc9f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Batch DXF to STL Converter</h1>
        <p style="text-align: center; margin-bottom: 20px;">
            <a href="index.html">Back to Home</a>
        </p>

        <div class="section">
            <h2>1. Select Profile Combination</h2>
            <div class="file-select">
                <label>Profile:</label>
                <select id="combo-select">
                    <option value="">-- Select Profile --</option>
                </select>
            </div>
        </div>

        <div class="section">
            <h2>2. Input DXF Files (from batch_convert/input/)</h2>
            <div class="file-list" id="input-files">
                <div class="file-item">Loading...</div>
            </div>
            <button id="refresh-btn" style="margin-top: 10px; padding: 8px 16px; font-size: 0.9em;">
                Refresh File List
            </button>
        </div>

        <div class="btn-container">
            <button id="convert-btn" disabled>Convert DXF to STL</button>
        </div>

        <div class="section">
            <h2>Progress</h2>
            <div class="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="status" id="status">Ready</div>
        </div>

        <div class="section">
            <h2>Log</h2>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script type="module">
        const el_select__combo = document.getElementById('combo-select');
        const el_div__input_file = document.getElementById('input-files');
        const el_btn__convert = document.getElementById('convert-btn');
        const el_btn__refresh = document.getElementById('refresh-btn');
        const el_div__progress_bar = document.getElementById('progress-bar');
        const el_div__status = document.getElementById('status');
        const el_div__log = document.getElementById('log');

        let a_s_input_file = [];
        let a_o_combo = [];
        let o_combo__selected = null;

        function f_log(s_message, s_type = '') {
            const el_entry = document.createElement('div');
            el_entry.className = 'log-entry ' + s_type;
            el_entry.textContent = `[${new Date().toLocaleTimeString()}] ${s_message}`;
            el_div__log.appendChild(el_entry);
            el_div__log.scrollTop = el_div__log.scrollHeight;
        }

        async function f_load_profile_combo() {
            try {
                const o_response = await fetch('/api/list-profile-combo');
                a_o_combo = await o_response.json();

                el_select__combo.innerHTML = '<option value="">-- Select Profile --</option>';

                a_o_combo.forEach((o_combo, n_idx) => {
                    const el_opt = document.createElement('option');
                    el_opt.value = n_idx;
                    el_opt.textContent = o_combo.s_name;
                    el_select__combo.appendChild(el_opt);
                });

                f_log(`Loaded ${a_o_combo.length} profile combinations`, 'info');
            } catch (o_err) {
                f_log('Error loading profile combos: ' + o_err.message, 'error');
            }
        }

        function f_handle_combo_change() {
            const s_val = el_select__combo.value;
            if (s_val === '') {
                o_combo__selected = null;
            } else {
                o_combo__selected = a_o_combo[parseInt(s_val)];
                if (o_combo__selected) {
                    f_log(`Selected: ${o_combo__selected.s_name}`, 'info');
                }
            }
            f_update_convert_btn();
        }

        async function f_load_input_file() {
            try {
                const o_response = await fetch('/api/list-input-files');
                a_s_input_file = await o_response.json();

                if (a_s_input_file.length === 0) {
                    el_div__input_file.innerHTML = '<div class="file-item">No DXF files found in batch_convert/input/</div>';
                } else {
                    el_div__input_file.innerHTML = a_s_input_file.map(s_f =>
                        `<div class="file-item" data-file="${s_f}">${s_f}</div>`
                    ).join('');
                }

                f_update_convert_btn();
                f_log(`Found ${a_s_input_file.length} input files`, 'info');
            } catch (o_err) {
                f_log('Error loading input files: ' + o_err.message, 'error');
                el_div__input_file.innerHTML = '<div class="file-item error">Error loading files</div>';
            }
        }

        function f_update_convert_btn() {
            const b_has_combo = o_combo__selected !== null;
            const b_has_file = a_s_input_file.length > 0;
            el_btn__convert.disabled = !(b_has_combo && b_has_file);
        }

        async function f_start_conversion() {
            if (!o_combo__selected || a_s_input_file.length === 0) {
                f_log('Please select a profile and ensure input files exist', 'error');
                return;
            }

            el_btn__convert.disabled = true;
            el_div__progress_bar.style.width = '0%';
            el_div__status.textContent = 'Starting conversion...';
            f_log('Starting batch conversion...', 'info');

            try {
                const o_response = await fetch('/api/batch-convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        profile: o_combo__selected.s_path__profile,
                        remover: o_combo__selected.s_path__remover
                    })
                });

                const o_reader = o_response.body.getReader();
                const o_decoder = new TextDecoder();
                let s_buffer = '';

                while (true) {
                    const { done, value } = await o_reader.read();
                    if (done) break;

                    s_buffer += o_decoder.decode(value, { stream: true });
                    const a_s_line = s_buffer.split('\n');
                    s_buffer = a_s_line.pop();

                    for (const s_line of a_s_line) {
                        if (s_line.trim()) {
                            try {
                                const o_event = JSON.parse(s_line);
                                f_handle_event(o_event);
                            } catch (e) {
                                console.log('Parse error:', s_line);
                            }
                        }
                    }
                }

                el_div__status.textContent = 'Conversion complete!';
                f_log('Batch conversion complete!', 'success');
            } catch (o_err) {
                f_log('Conversion error: ' + o_err.message, 'error');
                el_div__status.textContent = 'Error: ' + o_err.message;
            } finally {
                el_btn__convert.disabled = false;
                f_update_convert_btn();
            }
        }

        function f_handle_event(o_event) {
            switch (o_event.type) {
                case 'progress':
                    const n_pct = (o_event.current / o_event.total * 100).toFixed(0);
                    el_div__progress_bar.style.width = n_pct + '%';
                    el_div__status.textContent = `Processing ${o_event.current}/${o_event.total}: ${o_event.file}`;
                    break;
                case 'scad_generated':
                    f_log(`SCAD generated: ${o_event.file}`, 'success');
                    f_update_file_status(o_event.file, 'processing');
                    break;
                case 'stl_generated':
                    f_log(`STL generated: ${o_event.file}`, 'success');
                    if (o_event.log && o_event.log.trim()) {
                        f_log(`OpenSCAD output:\n${o_event.log}`, 'info');
                    }
                    f_update_file_status(o_event.file.replace('.stl', '.dxf'), 'processed');
                    break;
                case 'error':
                    f_log(`Error: ${o_event.file}`, 'error');
                    f_log(`${o_event.message}`, 'error');
                    f_update_file_status(o_event.file, 'error');
                    break;
                case 'complete':
                    el_div__progress_bar.style.width = '100%';
                    f_log(`Completed: ${o_event.success} successful, ${o_event.failed} failed`, 'info');
                    break;
            }
        }

        function f_update_file_status(s_filename, s_status) {
            const el_item = el_div__input_file.querySelector(`[data-file="${s_filename}"]`);
            if (el_item) {
                el_item.className = 'file-item ' + s_status;
            }
        }

        // Event listeners
        el_select__combo.addEventListener('change', f_handle_combo_change);
        el_btn__convert.addEventListener('click', f_start_conversion);
        el_btn__refresh.addEventListener('click', f_load_input_file);

        // Initial load
        f_load_profile_combo();
        f_load_input_file();
    </script>
</body>
</html>
