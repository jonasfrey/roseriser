<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roseriser - SCAD Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Header with DXF selectors */
        .header {
            padding: 12px 24px;
            background: #16213e;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #f0a04b;
            white-space: nowrap;
        }
        .dxf-selector {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .dxf-selector label {
            font-size: 10px;
            color: #8899a6;
            text-transform: uppercase;
        }
        .dxf-selector select {
            background: #0f3460;
            color: white;
            border: 1px solid #0f3460;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            min-width: 160px;
        }
        .dxf-selector select:hover {
            border-color: #f0a04b;
        }
        .dxf-selector select.loaded {
            background: #388a34;
        }
        .remover-info {
            font-size: 11px;
            color: #8899a6;
            align-self: flex-end;
            padding-bottom: 4px;
        }
        .remover-info.loaded {
            color: #388a34;
        }

        /* Main layout */
        .main-container {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* Left panel - Monaco editor */
        .editor-panel {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        .editor-tabs {
            display: flex;
            background: #252526;
            border-bottom: 1px solid #333;
        }
        .editor-tab {
            padding: 8px 16px;
            background: #2d2d2d;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 13px;
            border-right: 1px solid #333;
        }
        .editor-tab:hover {
            color: #fff;
        }
        .editor-tab.active {
            background: #1e1e1e;
            color: #fff;
        }
        #editor-container {
            flex: 1;
            overflow: hidden;
        }

        /* Right panel - SVG Viewer */
        .viewer-panel {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .viewer-toolbar {
            display: flex;
            gap: 8px;
            padding: 6px 8px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
        }
        .viewer-toolbar button {
            padding: 4px 10px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .viewer-toolbar button:hover {
            background: #e8e8e8;
        }
        .svg-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .svg-container:active {
            cursor: grabbing;
        }
        .svg-wrapper {
            position: absolute;
            transform-origin: 0 0;
        }
        .svg-wrapper svg {
            display: block;
        }
        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999;
        }

        /* Bottom bar */
        .bottom-bar {
            height: 32px;
            display: flex;
            align-items: center;
            background: #16213e;
            border-top: 1px solid #0f3460;
            padding: 0 16px;
            gap: 16px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .bottom-bar a {
            color: #4cc9f0;
            text-decoration: none;
        }
        .bottom-bar .status {
            color: #8899a6;
        }
        .bottom-bar .spacer {
            flex: 1;
        }
        .download-btn {
            background: #6a4c93;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .download-btn:hover {
            background: #7d5ba6;
        }
        .download-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Header with saved DXF selectors -->
    <div class="header">
        <h1>SCAD Generator</h1>
        <div class="dxf-selector">
            <label>Path</label>
            <select id="select-path">
                <option value="">-- Select path --</option>
            </select>
        </div>
        <div class="dxf-selector">
            <label>Profile</label>
            <select id="select-profile">
                <option value="">-- Select profile --</option>
            </select>
        </div>
        <span class="remover-info" id="remover-info">No remover</span>
    </div>

    <!-- Main layout -->
    <div class="main-container">
        <!-- Left: Monaco editor -->
        <div class="editor-panel">
            <div class="editor-tabs">
                <button class="editor-tab active" data-tab="path-sweep">Path Sweep</button>
                <button class="editor-tab" data-tab="cylindric-sweep">Cylindric Sweep</button>
                <button class="editor-tab" data-tab="buttons">Buttons</button>
                <button class="editor-tab" data-tab="json">JSON</button>
            </div>
            <div id="editor-container"></div>
        </div>

        <!-- Right: SVG preview -->
        <div class="viewer-panel">
            <div class="viewer-toolbar">
                <button id="zoom-in">Zoom +</button>
                <button id="zoom-out">Zoom -</button>
                <button id="zoom-fit">Fit</button>
                <button id="zoom-reset">1:1</button>
            </div>
            <div class="svg-container" id="svg-container">
                <div class="placeholder" id="placeholder">
                    <p>Select a path and profile to generate SCAD</p>
                </div>
                <div class="svg-wrapper" id="svg-wrapper"></div>
            </div>
        </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
        <a href="index.html">Home</a>
        <a href="unified.html">DXF Parser</a>
        <span class="status" id="status">Select saved DXFs to generate SCAD</span>
        <span class="spacer"></span>
        <button class="download-btn" id="dl-scad" disabled>Download SCAD</button>
        <button class="download-btn" id="dl-json" disabled>Download JSON</button>
    </div>

    <!-- Monaco Editor from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <!-- App module -->
    <script type="module" src="app-scad-generator.js"></script>
</body>
</html>
