<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roseriser - DXF Parser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 12px 24px;
            background: #16213e;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #f0a04b;
            white-space: nowrap;
        }
        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        .file-btn {
            background: #0f3460;
            color: #fff;
            border: 1px solid #f0a04b;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .file-btn:hover {
            background: #1a4a7a;
        }
        .file-name {
            color: #8899a6;
            font-size: 14px;
        }
        .file-name.loaded {
            color: #f0a04b;
        }

        /* SVG Grid - 2x2 */
        .svg-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
            background: #0f3460;
            min-height: 0;
        }
        .svg-panel {
            display: flex;
            flex-direction: column;
            background: #fff;
            min-height: 0;
            overflow: hidden;
        }
        .svg-panel-header {
            padding: 4px 10px;
            background: #e0e0e0;
            font-size: 11px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
            border-bottom: 1px solid #ccc;
            flex-shrink: 0;
        }
        .svg-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            cursor: grab;
            min-height: 0;
        }
        .svg-container:active {
            cursor: grabbing;
        }
        .svg-wrapper {
            position: absolute;
            transform-origin: 0 0;
        }
        .svg-wrapper svg {
            display: block;
        }

        /* Save controls */
        .save-controls {
            padding: 12px 24px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .save-controls label {
            font-size: 12px;
            color: #8899a6;
            text-transform: uppercase;
        }
        .save-controls input[type="text"] {
            background: #0f1a2e;
            color: #eee;
            border: 1px solid #0f3460;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            width: 200px;
        }
        .save-controls select {
            background: #0f1a2e;
            color: #eee;
            border: 1px solid #0f3460;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            min-width: 120px;
        }
        .save-btn {
            background: #388a34;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .save-btn:hover {
            background: #45a341;
        }
        .save-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .linked-profile-wrapper {
            display: none;
            align-items: center;
            gap: 8px;
        }
        .linked-profile-wrapper.visible {
            display: flex;
        }

        /* Bottom bar */
        .bottom-bar {
            height: 32px;
            display: flex;
            align-items: center;
            background: #0f1a2e;
            border-top: 1px solid #0f3460;
            padding: 0 16px;
            gap: 24px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .bottom-bar a {
            color: #4cc9f0;
            text-decoration: none;
        }
        .bottom-bar .status {
            color: #8899a6;
        }
        .bottom-bar .info-item {
            display: flex;
            gap: 4px;
        }
        .bottom-bar .info-label {
            color: #666;
        }
        .bottom-bar .info-value {
            color: #f0a04b;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>DXF Parser</h1>
        <div class="file-input-wrapper">
            <input type="file" accept=".dxf" id="file-input">
            <button class="file-btn" id="select-btn">Select DXF File</button>
        </div>
        <span class="file-name" id="file-name">No file selected</span>
    </div>

    <!-- 2x2 SVG Grid -->
    <div class="svg-grid">
        <div class="svg-panel">
            <div class="svg-panel-header">Entity Groups</div>
            <div class="svg-container" id="svg-container-0">
                <div class="svg-wrapper" id="svg-wrapper-0"></div>
            </div>
        </div>
        <div class="svg-panel">
            <div class="svg-panel-header">Points Ordered</div>
            <div class="svg-container" id="svg-container-1">
                <div class="svg-wrapper" id="svg-wrapper-1"></div>
            </div>
        </div>
        <div class="svg-panel">
            <div class="svg-panel-header">Points Mirrored</div>
            <div class="svg-container" id="svg-container-2">
                <div class="svg-wrapper" id="svg-wrapper-2"></div>
            </div>
        </div>
        <div class="svg-panel">
            <div class="svg-panel-header">Main SVG</div>
            <div class="svg-container" id="svg-container-3">
                <div class="svg-wrapper" id="svg-wrapper-3"></div>
            </div>
        </div>
    </div>

    <!-- Save controls -->
    <div class="save-controls">
        <label>Name:</label>
        <input type="text" id="input-name" placeholder="auto-filled from filename">

        <label>Type:</label>
        <select id="select-type">
            <option value="path">Path</option>
            <option value="profile">Profile</option>
            <option value="remover">Remover</option>
        </select>

        <div class="linked-profile-wrapper" id="linked-profile-wrapper">
            <label>Linked Profile:</label>
            <select id="select-linked-profile">
                <option value="">-- Select profile --</option>
            </select>
        </div>

        <button class="save-btn" id="save-btn" disabled>Save to Database</button>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
        <a href="index.html">Home</a>
        <a href="scad-generator.html">SCAD Generator</a>
        <span class="status" id="status">Select a DXF file to begin</span>
        <div class="info-item">
            <span class="info-label">Entities:</span>
            <span class="info-value" id="info-entity-count">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">Groups:</span>
            <span class="info-value" id="info-group-count">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">Connections:</span>
            <span class="info-value" id="info-connection-count">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">Points:</span>
            <span class="info-value" id="info-point-count">-</span>
        </div>
    </div>

    <script type="module" src="app-unified.js"></script>
</body>
</html>
